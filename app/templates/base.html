<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Knity Crochet{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Шапка сайта -->
    <nav class="navbar-custom mb-4">
        <div class="container d-flex align-items-center flex-nowrap">
            
            <!-- Левая часть: Логотип -->
            <div class="flex-fill d-flex justify-content-start">
                <a href="/" class="logo-text">
                    Knity<br>Crochet
                </a>
            </div>

            <!-- Центральная часть: Меню -->
            <div class="d-none d-md-flex align-items-center justify-content-center flex-fill" style="white-space: nowrap;">
                <a href="/contacts" class="nav-link-custom">Контакты</a>
                <a href="/" class="nav-link-custom">Каталог</a>
                <a href="/delivery" class="nav-link-custom">Доставка</a>
                <!-- Убрали класс nav-link-custom у div, чтобы не дублировать отступы -->
                <div id="nav-auth" class="d-flex align-items-center"></div>
            </div>

            <!-- Правая часть: Иконка корзины -->
            <div class="flex-fill d-flex justify-content-end">
                <a href="/cart">
                    <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                </a>
            </div>
            
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Подвал -->
    <footer class="text-center py-4 mt-5">
        <p class="mb-0">Магазин для творчества. Магазин для людей.</p>
        <p class="mb-0">© 2026 Knity Crochet.</p>
    </footer>

        <!-- Скрипт проверки авторизации -->
    <script>
        (function() {
            const token = localStorage.getItem('token');
            const nav = document.getElementById('nav-auth');
            if (token) {
                nav.innerHTML = `
                    <a href="/profile" class="nav-link-custom">Личный кабинет</a>
                    <a href="#" class="nav-link-custom" onclick="logout(event)">Выйти</a>
                `;
            } else {
                nav.innerHTML = `<a href="/login" class="nav-link-custom">Личный кабинет</a>`;
            }
        })();

        function logout(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('cart');
            window.location.href = '/';
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
